name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remitpulse
          POSTGRES_PASSWORD: remitpulse
          POSTGRES_DB: remitpulse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remitpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://remitpulse:remitpulse@localhost:5432/remitpulse_ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run format:check

      - run: npm run type-check

      - run: npm run build

      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - run: docker build -t remitpulse-backend:ci .
